#
# Checks on every push and pull request: the code compiles and the self-checks pass.
# (This workflow has not been run on GitHub yet.)
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standard-library self-checks (no installs)
        run: |
          python tests/test_hstl.py
          python tests/test_install.py
      - name: Everything compiles
        run: python -m compileall -q src plugins tests tools
      - name: Version
        run: python src/install.py --version
      - name: Format on real CAD geometry and plug-in logic against stand-ins
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery-ocp numpy trimesh numpy-stl
          python tests/test_hardpoint_cad.py
