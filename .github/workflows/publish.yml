#
# On every push to main (and on a v* tag, and by hand): make a GitHub Release from src/version.py
# (a pre-release while the version contains "wip") if that version has no release yet, and publish
# docs/ as the project page. This workflow has not been run on GitHub yet.
name: Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/version.py').read()).group(1))")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          mkdir dist
          git archive --format=zip --prefix=hardpoint-stl/ -o "dist/hardpoint-stl-$VER.zip" HEAD
          (cd dist && sha256sum "hardpoint-stl-$VER.zip" > SHA256SUMS.txt)
          awk -v v="$VER" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          { echo "Download **hardpoint-stl-$VER.zip**, unzip it and double-click the start file for your system (see the README). **Work in progress: not yet run in real FreeCAD, Fusion or a slicer.**"; echo; cat notes.md; } > notes_full.md
          FLAGS=""; case "$VER" in *wip*) FLAGS="--prerelease";; esac
          gh release create "$TAG" dist/* --title "Hardpoint STL $VER" --notes-file notes_full.md --target "$GITHUB_SHA" $FLAGS
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true      # best effort: Pages may need a one-time Settings > Pages > Source: GitHub Actions
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
